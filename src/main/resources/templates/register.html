<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản sinh viên - StudyHub</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container register-container">
    <div class="brand-header">
        <div class="brand-logo">SH</div>
        <h1 class="brand-title">Tạo tài khoản <span>Sinh viên</span></h1>
        <p class="brand-subtitle">Điền thông tin cá nhân của bạn để tham gia StudyHub</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-error" id="register-error-alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${errorMessage}">Đã xảy ra lỗi khi đăng ký!</span>
    </div>

    <form th:action="@{/register}" th:object="${registerDto}" method="post" id="register-form">
        <!-- Row 1: Full name & Department -->
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="fullName-input">Họ và tên <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input
                        type="text"
                        id="fullName-input"
                        th:field="*{fullName}"
                        class="form-control"
                        placeholder="vd: Nguyễn Văn An"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="department-select">Khoa / Chuyên ngành <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <select
                        id="department-select"
                        th:field="*{departmentId}"
                        class="form-control form-select"
                        required
                    >
                        <option value="">-- Chọn Khoa / Bộ môn --</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.name}">
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Row 2: Username & Email -->
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="username-input">Tên đăng nhập <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input
                        type="text"
                        id="username-input"
                        th:field="*{username}"
                        class="form-control"
                        placeholder="vd: sv003"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email-input">Địa chỉ Email <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input
                        type="email"
                        id="email-input"
                        th:field="*{email}"
                        class="form-control"
                        placeholder="vd: sv003@school.edu.vn"
                        required
                    >
                </div>
            </div>
        </div>

        <!-- Row 3: Phone & Student Code Auto Hint -->
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="phone-input">Số điện thoại</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <input
                        type="tel"
                        id="phone-input"
                        th:field="*{phone}"
                        class="form-control"
                        placeholder="vd: 0912345678"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mã sinh viên</label>
                <div class="auto-code-hint">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Cấp tự động khi tạo (vd: SV003)</span>
                </div>
            </div>
        </div>

        <!-- Row 4: Password & Confirm Password -->
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="password-input">Mật khẩu <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input
                        type="password"
                        id="password-input"
                        th:field="*{password}"
                        class="form-control"
                        placeholder="Tối thiểu 6 ký tự"
                        required
                    >
                    <button type="button" class="toggle-password" id="toggle-pw-btn" title="Hiện/Ẩn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-password-input">Xác nhận mật khẩu <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input
                        type="password"
                        id="confirm-password-input"
                        th:field="*{confirmPassword}"
                        class="form-control"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >
                    <button type="button" class="toggle-password" id="toggle-cpw-btn" title="Hiện/Ẩn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="btn-register-submit">
            <span>Tạo tài khoản sinh viên</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
        </button>

        <!-- Back to login link -->
        <div class="auth-switch-prompt">
            <span>Đã có tài khoản?</span>
            <a th:href="@{/login}" class="switch-link" id="link-back-to-login">Đăng nhập ngay</a>
        </div>
    </form>
</div>

<script>
    function setupToggle(btnId, inputId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        if (btn && input) {
            btn.addEventListener('click', function () {
                const isPassword = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPassword ? 'text' : 'password');
            });
        }
    }
    setupToggle('toggle-pw-btn', 'password-input');
    setupToggle('toggle-cpw-btn', 'confirm-password-input');
</script>

</body>
</html>
