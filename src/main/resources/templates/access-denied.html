<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối - StudyHub</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .error-card {
            text-align: center;
            max-width: 480px;
        }
        .error-icon {
            width: 72px;
            height: 72px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 14px;
            font-weight: 700;
            color: #ef4444;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .error-title {
            font-size: 22px;
            font-weight: 800;
            margin: 8px 0 12px;
            color: var(--text-primary);
        }
        .error-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
        }
        .btn-back:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="login-container error-card">
    <div class="error-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
    </div>
    <div class="error-code">Lỗi 403 - Forbidden</div>
    <h1 class="error-title">Truy cập bị từ chối</h1>
    <p class="error-desc">Tài khoản của bạn không có quyền truy cập vào tài nguyên này. Vui lòng quay lại bảng điều khiển hoặc liên hệ quản trị viên.</p>
    <a th:href="@{/dashboard}" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Quay về Bảng điều khiển</span>
    </a>
</div>

</body>
</html>
